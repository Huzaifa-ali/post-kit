<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome — post-kit</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="h-full flex items-center justify-center bg-surface">
  <div style="width: 100%; max-width: 32rem; margin: 0 auto; padding: 2rem;">
    <h1 class="text-xl font-bold text-primary mb-2">Welcome to post-kit</h1>
    <p class="text-secondary" style="margin-bottom: 2rem;">Let's set up your content pipeline. This takes about 3 minutes.</p>

    <div data-chat-messages class="space-y-4" style="margin-bottom: 1.5rem; max-height: 24rem; overflow-y: auto;">
      <div class="flex gap-3">
        <div class="rounded-xl px-4 py-2 text-sm bg-surface-raised text-primary border">
          Ready to set up? Type <strong>guided</strong> to start or <strong>manual</strong> for self-setup.
        </div>
      </div>
    </div>

    <form data-chat-form class="flex gap-2">
      <input type="text" data-chat-input
             placeholder="Type 'guided' to start..."
             class="flex-1 px-4 py-2 rounded-xl border bg-surface-raised text-primary text-sm"
             style="outline: none;">
      <button type="submit" class="px-4 py-2 rounded-xl bg-accent text-white text-sm font-medium hover:bg-accent-hover transition-colors">
        Start
      </button>
    </form>
  </div>
  <script type="module" src="/static/js/chat.js"></script>
</body>
</html>
