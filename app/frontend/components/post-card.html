<article class="rounded-lg border bg-surface-raised p-4 hover:border-accent/50 transition-colors cursor-pointer"
         data-post-id="{{ post.id }}">
  <div class="flex items-center justify-between mb-2">
    <span class="text-xs font-medium px-2 py-1 rounded-full"
          style="background: var(--color-status-{{ post.status }}); opacity: 0.8; color: white;">
      {{ post.status }}
    </span>
    <time class="text-xs text-muted">{{ post.created_at }}</time>
  </div>
  <h3 class="text-sm font-medium text-primary truncate">{{ post.title }}</h3>
  {% if post.pillar %}
    <span class="mt-2 inline-block text-xs text-secondary">{{ post.pillar }}</span>
  {% endif %}
</article>
